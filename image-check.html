<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAS Image Check</title><style>
body{font:15px system-ui;background:#171512;color:#eee;padding:20px;max-width:850px;margin:auto}h1{font:30px Georgia;color:#d6b27d}p{color:#bcb1a3}.summary{padding:15px;background:#252019;border:1px solid #55442d;margin:15px 0}.ok{color:#80d6a0}.bad{color:#ff9d9d}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:8px;border-bottom:1px solid #ffffff20;text-align:left}a{color:#d6b27d}</style></head><body>
<h1>Nude Art Studio · Image Check</h1><p>This diagnostic checks image files referenced by the existing gallery. It does not upload or modify images.</p><div id="summary" class="summary">Checking assets…</div><table><thead><tr><th>Artwork</th><th>Thumbnail</th><th>Full image</th></tr></thead><tbody id="rows"></tbody></table>
<script src="./data.js"></script><script>
(async()=>{const list=Array.isArray(window.ARTWORKS)?window.ARTWORKS:[];const base=new URL('.',location.href);const url=p=>new URL(String(p||'').replace(/^\/+/, '').replace(/^\.\//,''),base).href;const check=src=>new Promise(resolve=>{const im=new Image();im.onload=()=>resolve({ok:true,w:im.naturalWidth,h:im.naturalHeight});im.onerror=()=>resolve({ok:false});im.src=src;});let good=0,bad=0;const rows=[];for(const a of list){const [t,f]=await Promise.all([check(url(a.thumb)),check(url(a.full))]);if(t.ok&&f.ok)good++;else bad++;rows.push(`<tr><td>${String(a.title||'Untitled').replace(/[&<>]/g,'')}</td><td class="${t.ok?'ok':'bad'}">${t.ok?`OK ${t.w}×${t.h}`:'MISSING'}</td><td class="${f.ok?'ok':'bad'}">${f.ok?`OK ${f.w}×${f.h}`:'MISSING'}</td></tr>`);}document.getElementById('rows').innerHTML=rows.join('');document.getElementById('summary').innerHTML=`<b>${list.length}</b> artworks checked · <span class="ok">${good} complete</span> · <span class="bad">${bad} with missing images</span><br><small>Current site folder: ${base.href}</small>`;})();
</script></body></html>
